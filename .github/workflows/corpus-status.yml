name: corpus-status

# The audit job backs corpus/status claims without Rocq. The container job installs the pinned
# Rocq/MathComp graph stack and runs full acceptance plus active probes for changed milestones.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Toolchain-free corpus-status audit
        run: make audit

  changed-milestones:
    runs-on: ubuntu-latest
    container: mathcomp/mathcomp:2.5.0-rocq-prover-9.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install graph-theory dependencies
        run: |
          opam repo add rocq-released https://rocq-prover.org/opam/released --all-switches || true
          opam install -y coq-graph-theory coq-mathcomp-classical
      - name: Gate changed milestones and prospective probes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 meta/changed_milestones.py --base "$BASE_SHA" --head "$GITHUB_SHA" --run
